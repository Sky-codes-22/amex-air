databases:
  - name: amex-air-db
    plan: free
    databaseName: amex_air
    user: amex_air
services:
  - type: web
    name: amex-air
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amex-air-db
          property: connectionString
      - key: AIR_WORKER_TOKEN
        generateValue: true